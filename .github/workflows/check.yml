# Type-checks the frontend and runs the Rust tests on the dev branch and on pull requests.
name: Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential cmake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
