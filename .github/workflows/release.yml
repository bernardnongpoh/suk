# Publishes a release when changes are merged into main. The version comes from
# src-tauri/tauri.conf.json (bump it with scripts/bump-version.sh); a version that is already
# released is skipped, so merges that don't bump it don't rebuild anything.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      release_id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released. Bump the version (scripts/bump-version.sh) to release again."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        id: release
        if: steps.version.outputs.skip == 'false'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          cat > notes.md <<NOTES
          Install on macOS or Linux:

              curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh

          Or download the file for your computer below. On macOS, the app isn't signed yet: if you open the .dmg download, right-click the app and choose Open the first time.
          NOTES
          # Created through the API so its id comes back: drafts don't show up in release lists
          # for this workflow's token, so the id can't be looked up afterwards.
          id="$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Suk $tag" \
            -F body=@notes.md -F draft=true --jq .id)"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-14
          - name: macOS (Intel)
            runner: macos-15-intel
          - name: Linux (x86_64)
            runner: ubuntu-24.04
          - name: Linux (ARM64)
            runner: ubuntu-24.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev build-essential cmake file xdg-utils rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}

      - run: npm ci

      # The database links OpenSSL; on macOS link a static copy so the app doesn't need Homebrew's.
      - name: Static OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(scripts/static-openssl.sh "$RUNNER_TEMP/openssl-static")" >> "$GITHUB_ENV"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}

      - name: Check the macOS app doesn't depend on Homebrew
        if: runner.os == 'macOS'
        run: |
          binary="$(find src-tauri/target/release/bundle/macos -name suk -path '*Contents/MacOS*' | head -1)"
          otool -L "$binary"
          if otool -L "$binary" | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
            echo "The app links a library from Homebrew" >&2
            exit 1
          fi

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish
        run: |
          id="${{ needs.prepare.outputs.release_id }}"
          files="$(gh api "repos/${{ github.repository }}/releases/$id/assets" --paginate --jq '.[].name')"
          echo "$files"
          # Two macOS disk images, and a .deb, .rpm and AppImage for each Linux architecture.
          for pattern in '_aarch64\.dmg$' '_x64\.dmg$' '_amd64\.deb$' '_arm64\.deb$' '\.x86_64\.rpm$' '\.aarch64\.rpm$' '_amd64\.AppImage$' '_aarch64\.AppImage$'; do
            echo "$files" | grep -Eq "$pattern" || { echo "::error::Missing an installer matching $pattern; not publishing"; exit 1; }
          done
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false -f make_latest=true --jq .html_url
